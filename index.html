<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOUND WALK · 두 구역 테스트</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#map{position:fixed;inset:0;overflow:hidden;background:#111}
#photo{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.08);pointer-events:none}
#brand{position:absolute;z-index:10;left:18px;top:calc(env(safe-area-inset-top) + 18px);pointer-events:none}
#brand b{font-size:14px;letter-spacing:.18em}#brand div{margin-top:8px;font-size:12px;opacity:.82}
#intro{position:absolute;z-index:30;inset:0;display:grid;place-items:center;text-align:center;background:rgba(0,0,0,.16);transition:opacity .5s}
#intro.hide{opacity:0;pointer-events:none}
#intro .small{font-size:10px;letter-spacing:.2em;opacity:.72}
#intro h1{font-size:29px;font-weight:600;letter-spacing:-.04em;margin:10px 0}
#intro p{font-size:11px;opacity:.72;margin:0 0 22px}
#start{border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.25);color:#fff;border-radius:999px;padding:13px 19px;font-size:12px}
#status{position:absolute;z-index:20;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);padding:13px 14px;border-radius:16px;background:rgba(10,10,10,.80);backdrop-filter:blur(16px);font-size:11px;line-height:1.5;transform:translateY(150%);transition:transform .4s}
#status.show{transform:translateY(0)}
#dot{position:absolute;z-index:15;width:18px;height:18px;margin:-9px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.18);display:none}
.zone{position:absolute;z-index:12;border:1px solid rgba(255,255,255,.75);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:10px;background:rgba(255,255,255,.08);pointer-events:none}
#zoneA{width:70px;height:70px;margin:-35px}#zoneB{width:70px;height:70px;margin:-35px}
#panel{position:absolute;z-index:25;left:12px;right:12px;bottom:12px;padding:18px;border-radius:20px;background:rgba(15,15,15,.88);backdrop-filter:blur(20px);transform:translateY(130%);transition:transform .4s}
#panel.open{transform:translateY(0)}
#panel .tag{font-size:10px;letter-spacing:.15em;opacity:.55}
#panel h2{margin:7px 0 5px;font-size:21px;font-weight:550}
#panel p{margin:0;font-size:12px;opacity:.75}
</style>
</head>
<body>
<div id="map">
<img id="photo" src="map.jpg" alt="">
<div id="shade"></div>
<div id="brand"><b>SOUND WALK</b><div>두 구역 자동 전환 테스트</div></div>
<div id="dot"></div>
<div id="zoneA" class="zone">01</div>
<div id="zoneB" class="zone">02</div>
</div>

<div id="intro">
  <div>
    <div class="small">GPS SOUND WALK · 2 ZONES</div>
    <h1>이제, 걸어보세요</h1>
    <p>한 번 누르면 GPS가 시작됩니다.</p>
    <button id="start">위치 사용 시작 →</button>
  </div>
</div>

<div id="status"><b id="state">GPS 대기 중</b><br><span id="coords">위치를 기다리고 있습니다.</span></div>

<div id="panel"><div class="tag" id="tag">SOUND POINT</div><h2 id="title">-</h2><p id="desc">-</p></div>

<script>
const photo=document.getElementById('photo'), map=document.getElementById('map');
const intro=document.getElementById('intro'), start=document.getElementById('start');
const status=document.getElementById('status'), state=document.getElementById('state'), coords=document.getElementById('coords');
const dot=document.getElementById('dot'), zoneAEl=document.getElementById('zoneA'), zoneBEl=document.getElementById('zoneB');
const panel=document.getElementById('panel'), tag=document.getElementById('tag'), title=document.getElementById('title'), desc=document.getElementById('desc');

const zones=[
 {id:'A',name:'첫 번째 장소',file:'sound01.mp3',lat:37.748881513354,lon:126.36420024262,radius:15},
 // Test zone B: about 60m north of zone A. This is intentionally a test coordinate.
 {id:'B',name:'두 번째 장소',file:'sound02.mp3',lat:37.749420000000,lon:126.36420024262,radius:15}
];
let watchId=null, currentZone=null, insideCounts={A:0,B:0};
let audio=null, started=false;

function setStatus(a,b){state.textContent=a;coords.textContent=b;status.classList.add('show')}
function metersBetween(lat1,lon1,lat2,lon2){
 const R=6371000,rad=x=>x*Math.PI/180,dLat=rad(lat2-lat1),dLon=rad(lon2-lon1);
 const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(a));
}
function showZone(z){
 currentZone=z.id;
 tag.textContent=z.id==='A'?'01 · SOUND POINT':'02 · SOUND POINT';
 title.textContent=z.name;
 desc.textContent=z.id==='A'?'「떠나자」':'「우리는 어디에서 만나나요」';
 panel.classList.add('open');
}
async function switchAudio(z){
 // Intentionally start from 0 only when entering a zone.
 if(audio){
   try{
     const old=audio; const startVol=old.volume; let i=0;
     const timer=setInterval(()=>{i++;old.volume=Math.max(0,startVol*(1-i/8));if(i>=8){clearInterval(timer);old.pause();old.currentTime=0;old.volume=1;}},70);
   }catch(e){}
 }
 const next=new Audio(z.file); next.preload='auto'; next.volume=1; audio=next;
 try{
   await next.play();
   setStatus(z.name+' · 재생 중','음원: '+z.file+' · GPS 영역 반경 '+z.radius+'m');
 }catch(e){
   setStatus(z.name+' · 소리 재생이 차단됨','GPS 영역 진입은 감지했습니다. 브라우저의 자동재생 정책 테스트가 필요합니다.');
 }
}
function positionZones(){
 const r=photo.getBoundingClientRect(),mr=map.getBoundingClientRect();
 const points=[['zoneA',.535,.665],['zoneB',.535,.635]];
 for(const [id,x,y] of points){
   const el=document.getElementById(id);
   el.style.left=(r.left-mr.left+x*r.width)+'px';
   el.style.top=(r.top-mr.top+y*r.height)+'px';
 }
}
function fit(){
 const s=Math.min(map.clientWidth/photo.naturalWidth,map.clientHeight/photo.naturalHeight);
 const sw=photo.naturalWidth*s,sh=photo.naturalHeight*s;
 photo.style.transform=`translate3d(${(map.clientWidth-sw)/2}px,${(map.clientHeight-sh)/2}px,0) scale(${s})`;
 positionZones();
}
function startGPS(){
 intro.classList.add('hide');
 zoneAEl.style.display='flex';zoneBEl.style.display='flex';dot.style.display='block';
 if(!navigator.geolocation){setStatus('GPS를 지원하지 않습니다','Safari 또는 Chrome 최신 버전을 사용해 주세요.');return}
 setStatus('GPS 연결 중…','현재 위치를 기다리고 있습니다.');
 watchId=navigator.geolocation.watchPosition(pos=>{
   const lat=pos.coords.latitude,lon=pos.coords.longitude,acc=Math.round(pos.coords.accuracy);
   let best=null,bestD=Infinity;
   for(const z of zones){
     const d=metersBetween(lat,lon,z.lat,z.lon);
     if(d<bestD){bestD=d;best=z}
     if(d<=z.radius) insideCounts[z.id]++; else insideCounts[z.id]=0;
   }
   setStatus('GPS 연결됨',`목표 ${best.id}까지 약 ${Math.round(bestD)}m · 정확도 약 ${acc}m`);
   if(best && insideCounts[best.id]>=2 && currentZone!==best.id) switchAudio(best),showZone(best);
 },err=>{
   const m={1:'위치 권한이 거부되었습니다.',2:'현재 위치를 확인할 수 없습니다.',3:'GPS 요청 시간이 초과되었습니다.'}[err.code]||'GPS 오류';
   setStatus('GPS 오류',m);
 },{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
}
photo.onload=fit;window.addEventListener('resize',fit);
start.addEventListener('click',()=>{started=true;startGPS()});
</script>
</body>
</html>
