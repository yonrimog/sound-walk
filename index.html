<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOUND WALK</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.hero{position:relative;width:100vw;height:100svh;overflow:hidden;color:#fff}

.map{
 position:absolute;inset:0;
 background-image:url("map.jpg");
 background-repeat:no-repeat;
 background-size:auto 151.1%;
 background-position:60.2% 70.0%;
 transform:scale(1);
 transform-origin:50% 50%;
 transition:transform 5.8s cubic-bezier(.16,.72,.16,1);
 will-change:transform;
}
.map:after{
 content:"";position:absolute;inset:0;
 background:rgba(0,0,0,.035);
}

.brand{
 position:absolute;z-index:5;
 top:calc(env(safe-area-inset-top) + 25px);
 left:28px;
 text-shadow:0 1px 7px rgba(0,0,0,.22);
 animation:floatTitle 4.6s ease-in-out infinite;
}
.brand-title{
 font-size:38px;
 line-height:1;
 font-weight:500;
 letter-spacing:.17em;
}
.brand-sub{
 margin-top:10px;
 font-size:22px;
 letter-spacing:.06em;
}
@keyframes floatTitle{
 0%,100%{transform:translate3d(0,0,0)}
 50%{transform:translate3d(0,-5px,0)}
}

.haenggung{
 position:absolute;z-index:3;
 left:50%;top:49%;
 transform:translate(-50%,-50%) scaleX(1.3) scaleY(2);
 white-space:nowrap;pointer-events:none;
 font-family:"Do Hyeon",Impact,"Arial Narrow",sans-serif;
 font-size:clamp(120px,27vw,360px);
 font-weight:700;
 letter-spacing:.02em;
 color:rgba(255,255,255,.22);
}

.dots{position:absolute;inset:0;z-index:6;pointer-events:none}
.dot{
 position:absolute;width:9px;height:9px;border-radius:50%;
 background:rgba(255,255,255,.9);
 opacity:0;
 animation:dotWalk 2.4s ease-in-out forwards;
}
@keyframes dotWalk{
 0%{opacity:0;transform:scale(.45)}
 18%{opacity:.9;transform:scale(1)}
 62%{opacity:.9;transform:scale(1)}
 100%{opacity:0;transform:scale(.45)}
}

.cta{
 position:absolute;z-index:8;
 left:50%;
 bottom:calc(env(safe-area-inset-bottom) + 42px);
 transform:translateX(-50%);
 width:148px;height:148px;border-radius:50%;
 border:1px solid rgba(255,255,255,.86);
 background:rgba(0,0,0,.10);
 color:#fff;
 font-size:22px;line-height:1.45;letter-spacing:.03em;
 backdrop-filter:none;-webkit-backdrop-filter:none;
 cursor:pointer;
 transition:opacity .8s,transform .2s;
}
.cta:active{transform:translateX(-50%) scale(.97)}
.arrow{display:block;margin-top:7px;font-size:23px;line-height:1}

@media(min-width:700px){
 .brand{left:42px}
 .cta{bottom:52px}
}

.info-nav{position:absolute;z-index:10;left:28px;top:calc(env(safe-area-inset-top) + 112px);display:flex;gap:18px;align-items:center;font-size:15px;letter-spacing:-.02em;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.info-nav button{appearance:none;border:0;background:none;color:#fff;padding:5px 0;font:inherit;cursor:pointer}
.info-panel{position:absolute;z-index:20;inset:0;background:rgba(0,0,0,.72);color:#fff;padding:calc(env(safe-area-inset-top) + 76px) 28px calc(env(safe-area-inset-bottom) + 32px);opacity:0;pointer-events:none;transition:opacity .35s ease;overflow:auto}
.info-panel.open{opacity:1;pointer-events:auto}.info-panel-inner{max-width:560px;margin:0 auto}.info-panel h2{font-size:25px;margin:0 0 22px;font-weight:500}.info-panel p{font-size:18px;line-height:1.8;margin:0 0 28px}.info-panel .credit{font-size:17px;line-height:2}
.info-close{position:absolute;right:24px;top:calc(env(safe-area-inset-top) + 22px);color:#fff;background:none;border:0;font-size:25px;cursor:pointer}
.mini-map{width:100%;aspect-ratio:4/3;margin:8px 0 28px;background:url("guide-map.jpg") center/cover no-repeat;border:1px solid rgba(255,255,255,.45)}
</style>
</head>
<body>
<div class="hero">
<div class="info-nav" aria-label="안내 메뉴">
<button type="button" data-panel="how">사용방법</button>
<button type="button" data-panel="mapinfo">지도</button>
<button type="button" data-panel="credits">만든 사람들</button>
</div>
<div class="info-panel" id="how" aria-hidden="true"><button class="info-close" type="button">×</button><div class="info-panel-inner"><h2>사용방법</h2><p>이어폰을 준비해주세요.<br>「이제, 걸어보세요」를 누르고 위치 사용을 허용해주세요.<br>지도를 따라 걸으면 장소에 가까워질 때 소리가 시작됩니다.<br>다른 구역으로 이동하면 새로운 소리가 이어집니다.</p></div></div>
<div class="info-panel" id="mapinfo" aria-hidden="true"><button class="info-close" type="button">×</button><div class="info-panel-inner"><h2>지도</h2><div class="mini-map"></div><p>지도를 따라 천천히 걸어보세요.<br>각 장소에서 새로운 소리를 만날 수 있습니다.</p></div></div>
<div class="info-panel" id="credits" aria-hidden="true"><button class="info-close" type="button">×</button><div class="info-panel-inner"><h2>만든 사람들</h2><div class="credit">황혜신<br>신혜원<br>연리목<br>마린보이<br>수원문화재단</div></div></div>

  <div class="map" id="map"></div>

  <div class="brand">
    <div class="brand-title">SOUND WALK</div>
    <div class="brand-sub">시간이 쌓이는 그곳</div>
  </div>

  <div class="haenggung">행궁동</div>

  <div class="dots" id="dots"></div>

  <button class="cta" id="cta">
    이제,<br>걸어보세요
    <span class="arrow">→</span>
  </button>
</div>

<script>
const dots=document.getElementById('dots');
const map=document.getElementById('map');
const cta=document.getElementById('cta');

function walkDots(){
 const w=innerWidth,h=innerHeight;
 const sx=w*.18, sy=h*.56;
 const ex=w*.82, ey=h*.43;
 const n=12, gap=1800;

 for(let i=0;i<n;i++){
   const t=i/(n-1);
   const d=document.createElement('i');
   d.className='dot';
   d.style.left=(sx+(ex-sx)*t)+'px';
   d.style.top=(sy+(ey-sy)*t+Math.sin(t*Math.PI*2)*14)+'px';
   d.style.animationDelay=(i*gap)+'ms';
   dots.appendChild(d);
   setTimeout(()=>d.remove(),i*gap+2600);
 }
 setTimeout(walkDots,n*gap+2800);
}
walkDots();

cta.addEventListener('click',()=>{
 map.style.transform='scale(2.61)';
 cta.style.opacity='0';
 setTimeout(()=>cta.remove(),900);
});

const infoButtons=document.querySelectorAll('.info-nav button');
const panels=document.querySelectorAll('.info-panel');
infoButtons.forEach(b=>b.addEventListener('click',()=>{panels.forEach(x=>x.classList.remove('open'));const x=document.getElementById(b.dataset.panel);if(x)x.classList.add('open')}));
document.querySelectorAll('.info-close').forEach(b=>b.addEventListener('click',()=>b.closest('.info-panel').classList.remove('open')));
</script>
</body>
</html>
