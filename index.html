<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOUND WALK</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap');

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.hero{position:relative;width:100vw;height:100svh;overflow:hidden;color:#fff}

.map{
 position:absolute;inset:0;
 background:url("map.jpg") center/cover no-repeat;
 transition:transform 5.5s cubic-bezier(.16,.72,.16,1);
}
.map:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.045)}

.brand{
 position:absolute;z-index:5;
 top:calc(env(safe-area-inset-top) + 25px);left:28px;
 text-shadow:0 1px 7px rgba(0,0,0,.2)
}
.brand-title{font-size:25px;letter-spacing:.17em;font-weight:500}
.brand-sub{margin-top:8px;font-size:15px;letter-spacing:.06em}

.haenggung{
 position:absolute;z-index:3;left:50%;top:48%;
 transform:translate(-50%,-50%);
 white-space:nowrap;pointer-events:none;
 font-family:"Do Hyeon",Impact,"Arial Narrow",sans-serif;
 font-size:clamp(90px,17vw,235px);
 font-weight:400;letter-spacing:.025em;
 color:rgba(255,255,255,.19);
 text-shadow:0 0 1px rgba(0,0,0,.12);
}

.dots{position:absolute;inset:0;z-index:6;pointer-events:none}
.dot{
 position:absolute;width:8px;height:8px;border-radius:50%;
 background:rgba(255,255,255,.88);
 opacity:0;
 animation:dotWalk 2.4s ease-in-out forwards;
}
@keyframes dotWalk{
 0%{opacity:0;transform:scale(.45)}
 18%{opacity:.9;transform:scale(1)}
 62%{opacity:.9;transform:scale(1)}
 100%{opacity:0;transform:scale(.45)}
}

.cta{
 position:absolute;z-index:8;left:50%;
 bottom:calc(env(safe-area-inset-bottom) + 42px);
 transform:translateX(-50%);
 width:148px;height:148px;border-radius:50%;
 border:1px solid rgba(255,255,255,.86);
 background:rgba(0,0,0,.10);color:#fff;
 font-size:17px;line-height:1.45;letter-spacing:.03em;
 backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
 cursor:pointer;transition:opacity .8s,transform .2s;
}
.cta:active{transform:translateX(-50%) scale(.97)}
.arrow{display:block;margin-top:7px;font-size:23px;line-height:1}

@media(min-width:700px){
 .brand{left:42px}
 .cta{bottom:52px}
}
</style>
</head>
<body>
<div class="hero">
  <div class="map" id="map"></div>
  <div class="brand">
    <div class="brand-title">SOUND WALK</div>
    <div class="brand-sub">시간이 쌓이는 그곳</div>
  </div>
  <div class="haenggung">행궁동</div>
  <div class="dots" id="dots"></div>
  <button class="cta" id="cta">이제,<br>걸어보세요<span class="arrow">→</span></button>
</div>

<script>
const dots=document.getElementById('dots');
const map=document.getElementById('map');
const cta=document.getElementById('cta');

function walkDots(){
 const w=innerWidth,h=innerHeight;
 const sx=w*.18, sy=h*.55;
 const ex=w*.82, ey=h*.42;
 const n=12, gap=1800;
 for(let i=0;i<n;i++){
   const t=i/(n-1);
   const d=document.createElement('i');
   d.className='dot';
   d.style.left=(sx+(ex-sx)*t)+'px';
   d.style.top=(sy+(ey-sy)*t+Math.sin(t*Math.PI*2)*14)+'px';
   d.style.animationDelay=(i*gap)+'ms';
   dots.appendChild(d);
   setTimeout(()=>d.remove(),i*gap+2600);
 }
 setTimeout(walkDots,n*gap+2800);
}
walkDots();

cta.addEventListener('click',()=>{
 map.style.transform='scale(1.78)';
 cta.style.opacity='0';
 setTimeout(()=>cta.remove(),900);
});
</script>
</body>
</html>
