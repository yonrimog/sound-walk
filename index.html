<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOUND WALK</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{position:relative;width:100%;height:100%;overflow:hidden;color:#fff;background:#111}
#map{position:absolute;inset:0;overflow:hidden}
#photo{position:absolute;left:0;top:0;width:100%;height:auto;max-width:none;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none}
.shade{position:absolute;inset:0;pointer-events:none;background:rgba(0,0,0,.10)}
header{position:absolute;top:0;left:0;z-index:10;padding:calc(env(safe-area-inset-top) + 22px) 24px}
.brand{font-size:17px;letter-spacing:.20em;font-weight:500}
.tagline{margin-top:7px;font-size:13px;letter-spacing:.08em;opacity:.9}
#district{
 position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);
 z-index:3;pointer-events:none;white-space:nowrap;
 font-size:clamp(72px,17vw,220px);font-weight:500;letter-spacing:.10em;
 color:rgba(255,255,255,.14);filter:blur(.7px);
}
#footprints{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.foot{position:absolute;width:18px;height:34px;opacity:0;filter:blur(.15px)}
.foot::before{
 content:"";position:absolute;inset:0;
 border-radius:55% 45% 48% 52% / 58% 52% 48% 42%;
 background:rgba(255,255,255,.78);
}
.foot.left{transform:rotate(-18deg)}
.foot.right{transform:rotate(18deg)}
#walkButton{
 position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 42px);
 transform:translateX(-50%);
 z-index:20;width:142px;height:142px;border-radius:50%;
 border:1px solid rgba(255,255,255,.78);
 background:rgba(0,0,0,.12);color:#fff;
 font-size:16px;line-height:1.45;letter-spacing:.04em;
 backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
 cursor:pointer;
}
#walkButton span{display:block;font-size:24px;line-height:1;margin-top:6px}
#walkButton:active{transform:translateX(-50%) scale(.97)}
#zoomHint{
 position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0;
 background:rgba(0,0,0,0);transition:opacity .8s;
}
@media(min-width:700px){
 header{padding-left:42px}
 #walkButton{bottom:52px}
}
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <img id="photo" src="suwon_orthophoto_web.jpg" alt="">
    <div class="shade"></div>
  </div>

  <header>
    <div class="brand">SOUND WALK</div>
    <div class="tagline">시간이 쌓이는 그곳</div>
  </header>

  <div id="district">행궁동</div>
  <div id="footprints"></div>

  <button id="walkButton">이제,<br>걸어보세요<span>→</span></button>
  <div id="zoomHint"></div>
</div>

<script>
const photo=document.getElementById('photo');
const map=document.getElementById('map');
const button=document.getElementById('walkButton');
const fp=document.getElementById('footprints');

let scale=1,tx=0,ty=0;

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fitScale(){
  return Math.min(map.clientWidth/photo.naturalWidth,map.clientHeight/photo.naturalHeight);
}
function apply(animated=false){
  photo.style.transition=animated?'transform 4.8s cubic-bezier(.18,.78,.18,1)':'none';
  photo.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`;
}
function centerOn(nx,ny,targetScale){
  const mw=map.clientWidth,mh=map.clientHeight;
  const sw=photo.naturalWidth*targetScale,sh=photo.naturalHeight*targetScale;
  scale=targetScale;
  tx=mw/2-nx*sw; ty=mh/2-ny*sh;
  tx=clamp(tx,mw-sw,0); ty=clamp(ty,mh-sh,0);
  apply(true);
}

function makeFootprint(side){
  const el=document.createElement('div');
  el.className='foot '+side;
  fp.appendChild(el);
  return el;
}

function walkCycle(){
  const w=map.clientWidth,h=map.clientHeight;
  const startX=-40,endX=w+40;
  const baseY=h*0.46;
  const distance=endX-startX;
  const duration=4200; // comfortable walking pace
  const steps=[];
  for(let i=0;i<10;i++){
    const el=makeFootprint(i%2===0?'left':'right');
    steps.push(el);
  }
  steps.forEach((el,i)=>{
    const delay=i*380;
    const y=baseY + Math.sin(i*1.7)*26 + (i%2?10:-10);
    el.style.top=y+'px';
    el.style.animation=`walk ${duration}ms linear ${delay}ms forwards`;
    el.style.setProperty('--sx',startX+'px');
    el.style.setProperty('--ex',(startX+distance)+'px');
    el.style.setProperty('--rot',i%2===0?'-18deg':'18deg');
  });
  const style=document.createElement('style');
  style.textContent=`
  @keyframes walk{
    0%{left:var(--sx);opacity:0;transform:translateY(0) rotate(var(--rot))}
    5%{opacity:.82}
    92%{opacity:.82}
    100%{left:var(--ex);opacity:0;transform:translateY(-4px) rotate(var(--rot))}
  }`;
  document.head.appendChild(style);
  setTimeout(()=>{steps.forEach(e=>e.remove());style.remove();},duration+steps.length*380+100);
}
photo.onload=()=>{
  const s=fitScale();
  scale=s;
  tx=(map.clientWidth-photo.naturalWidth*s)/2;
  ty=(map.clientHeight-photo.naturalHeight*s)/2;
  apply(false);
  walkCycle();
  setInterval(walkCycle,7000);
};
window.addEventListener('resize',()=>apply(false));

button.addEventListener('click',()=>{
  button.style.opacity='.0';
  document.getElementById('district').style.opacity='.0';
  // Slowly move from the whole-city view into Haenggung-dong.
  centerOn(0.535,0.665,Math.max(fitScale()*5.1,.42));
  setTimeout(()=>button.style.display='none',800);
});
</script>
</body>
</html>
