<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>망월리 GPS 다각형 테스트</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0}
svg{width:100%;height:100%;display:block}
.zone{fill:rgba(20,140,220,.18);stroke:rgba(20,120,210,.95);stroke-width:4;vector-effect:non-scaling-stroke}
.zone.active{fill:rgba(30,180,90,.25);stroke:rgba(20,145,75,1)}
.label{font-size:24px;font-weight:700;fill:#222;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
#title{position:absolute;z-index:20;left:14px;top:calc(env(safe-area-inset-top) + 12px);padding:10px 13px;border-radius:14px;background:rgba(20,20,20,.86);color:#fff}
#title b{font-size:14px;letter-spacing:.08em}
#title div{font-size:11px;margin-top:4px;opacity:.8}
#panel{position:absolute;z-index:30;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);padding:13px 14px;border-radius:17px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);box-shadow:0 6px 25px rgba(0,0,0,.15)}
#state{font-weight:700;font-size:14px}
#detail{font-size:11px;line-height:1.5;margin-top:4px;color:#555}
button{margin-top:9px;border:0;border-radius:999px;background:#222;color:#fff;padding:11px 17px;font-size:12px}
#now{position:absolute;z-index:25;display:none;width:18px;height:18px;margin:-9px;border-radius:50%;background:#ff3b30;border:3px solid white;box-shadow:0 1px 8px rgba(0,0,0,.35)}
#hint{font-size:10px;color:#777;margin-top:5px}
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <svg viewBox="0 0 1160 1016" preserveAspectRatio="xMidYMid slice" aria-label="망월리 GPS 테스트 지도">
      <image href="map.png" x="0" y="0" width="1160" height="1016" preserveAspectRatio="none"></image>

      <!-- 사용자가 표시한 도로 구역을 다각형으로 테스트 -->
      <polygon id="p1" class="zone" points="650,550 795,545 890,470 915,485 820,575 665,585"></polygon>
      <polygon id="p2" class="zone" points="850,205 875,195 935,445 900,470 860,315"></polygon>
      <polygon id="p3" class="zone" points="975,350 1155,275 1158,330 1000,420 970,400"></polygon>

      <text class="label" x="760" y="535">①</text>
      <text class="label" x="880" y="350">②</text>
      <text class="label" x="1060" y="350">③</text>
      <text class="label" x="565" y="485">출발</text>
    </svg>
  </div>

  <div id="now"></div>

  <div id="title"><b>GPS SOUND WALK TEST</b><div>망월리 · 다각형 구역 테스트</div></div>

  <div id="panel">
    <div id="state">GPS 대기 중</div>
    <div id="detail">버튼을 눌러 위치 사용을 시작하세요.</div>
    <button id="start">GPS 테스트 시작 →</button>
    <div id="hint">한 번 시작한 음악은 구역 밖으로 나가도 파일이 끝날 때까지 계속 재생됩니다. 다른 구역에 들어가면 그 음악으로 즉시 전환됩니다.</div>
  </div>
</div>

<script>
const zones = [
  {
    id:1, name:'음악 1', file:'sound01.wav',
    polygon:[
      [37.748781100,126.364283800],
      [37.748771327,126.364591536],
      [37.748893192,126.364817435],
      [37.748863140,126.364865123],
      [37.748714449,126.364634147],
      [37.748716572,126.364303612]
    ]
  },
  {
    id:2, name:'음악 2', file:'sound02.wav',
    polygon:[
      [37.749372270,126.364822713],
      [37.749386927,126.364878864],
      [37.748932093,126.364920877],
      [37.748891901,126.364838541],
      [37.749174260,126.364806584]
    ]
  },
  {
    id:3, name:'음악 3', file:'sound03.wav',
    polygon:[
      [37.749096824,126.365037460],
      [37.749207718,126.365442764],
      [37.749108971,126.365430479],
      [37.748968412,126.365066531],
      [37.749008051,126.365009982]
    ]
  }
];

const startPoint={lat:37.748881513354,lon:126.36420024262};
const audio={};
let watchId=null, currentZone=null, currentAudio=null;

for(const z of zones){
  const a=new Audio(z.file);
  a.preload='auto';
  audio[z.id]=a;
}

function pointInPolygon(lat,lon,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][0], xi=poly[i][1];
    const yj=poly[j][0], xj=poly[j][1];
    const intersect=((yi>lat)!=(yj>lat)) &&
      (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}

function stopCurrent(){
  // IMPORTANT: do NOT stop when merely leaving a zone.
  // This function is only called when another zone is entered.
  if(currentAudio){
    currentAudio.pause();
    currentAudio.currentTime=0;
  }
}

function enterZone(z){
  if(currentZone===z.id) return;
  stopCurrent();
  currentZone=z.id;
  currentAudio=audio[z.id];
  currentAudio.currentTime=0;
  currentAudio.play().catch(()=>{});
  document.querySelectorAll('.zone').forEach(el=>el.classList.remove('active'));
  document.getElementById('p'+z.id).classList.add('active');
  document.getElementById('state').textContent=`${z.id}번 구역 · ${z.name} 재생`;
}

function handlePosition(pos){
  const lat=pos.coords.latitude, lon=pos.coords.longitude;
  const acc=Math.round(pos.coords.accuracy);
  const found=zones.find(z=>pointInPolygon(lat,lon,z.polygon));

  // Show current GPS point on the same map coordinate system.
  // The map is a static test image; this transform is calibrated to the known points used for the test.
  const x = 468367.34000421*lon - 88653.80776047*lat - 55837680.29190375;
  const y = -33803.66866685*lon - 552773.08548279*lat + 25138636.58296865;
  const now=document.getElementById('now');
  now.style.display='block';
  now.style.left=(x/1160*100)+'%';
  now.style.top=(y/1016*100)+'%';

  if(found){
    enterZone(found);
    document.getElementById('detail').textContent=
      `현재 위치 · 위도 ${lat.toFixed(6)} / 경도 ${lon.toFixed(6)} · GPS 정확도 약 ${acc}m`;
  }else{
    // Leaving a zone does NOT stop the current file.
    const playing=currentZone ? `음악 ${currentZone} 재생 중` : '대기 중';
    document.getElementById('state').textContent=playing;
    document.getElementById('detail').textContent=
      `현재 위치 · 위도 ${lat.toFixed(6)} / 경도 ${lon.toFixed(6)} · GPS 정확도 약 ${acc}m`;
  }
}

document.getElementById('start').onclick=()=>{
  if(!navigator.geolocation){
    document.getElementById('state').textContent='이 브라우저에서는 GPS를 사용할 수 없습니다.';
    return;
  }
  // Unlock audio on the user gesture.
  Object.values(audio).forEach(a=>{a.load();});
  document.getElementById('start').style.display='none';
  document.getElementById('state').textContent='GPS 권한 요청 중…';
  watchId=navigator.geolocation.watchPosition(handlePosition,err=>{
    document.getElementById('state').textContent='GPS 오류';
    document.getElementById('detail').textContent=
      err.code===1 ? '위치 권한을 허용해 주세요.' : '현재 위치를 확인할 수 없습니다.';
  },{
    enableHighAccuracy:true,
    maximumAge:2000,
    timeout:15000
  });
};
</script>
</body>
</html>
