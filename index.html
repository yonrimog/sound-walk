<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>망월리 GPS 구역 테스트</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f7f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0;overflow:hidden;background:#f7f7f7}
#photo{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none}
#veil{position:absolute;inset:0;background:rgba(255,255,255,.08);pointer-events:none}
#title{position:absolute;z-index:20;left:16px;top:calc(env(safe-area-inset-top) + 14px);padding:10px 13px;border-radius:14px;background:rgba(20,20,20,.82);color:#fff}
#title b{font-size:14px;letter-spacing:.08em}
#title div{font-size:11px;margin-top:5px;opacity:.78}
.zone{position:absolute;z-index:12;width:78px;height:78px;margin:-39px;border:3px solid rgba(20,120,210,.95);border-radius:50%;background:rgba(40,150,220,.13);display:grid;place-items:center;text-align:center}
.zone span{display:block;font-size:13px;font-weight:700;background:rgba(255,255,255,.92);padding:4px 7px;border-radius:999px}
.zone small{display:block;font-size:9px;margin-top:3px;background:rgba(255,255,255,.9);padding:2px 5px;border-radius:999px}
#z1{left:52%;top:67.5%}
#z2{left:40.8%;top:79.1%}
#z3{left:87.4%;top:80.5%}
#z4{left:67.9%;top:31.5%}
#startMark{position:absolute;z-index:13;left:51.2%;top:49.2%;width:24px;height:24px;margin:-12px;border-radius:50%;background:#e85c45;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#startLabel{position:absolute;z-index:13;left:51.2%;top:49.2%;transform:translate(14px,-9px);background:rgba(255,255,255,.94);padding:5px 8px;border-radius:9px;font-size:10px;font-weight:600;white-space:nowrap}
#legend{position:absolute;z-index:25;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 86px);padding:10px 12px;border-radius:15px;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);font-size:11px;line-height:1.55}
#legend b{font-size:12px}
#start{position:absolute;z-index:30;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);border:0;border-radius:999px;background:#222;color:#fff;padding:14px 20px;font-size:13px;box-shadow:0 5px 18px rgba(0,0,0,.2)}
#status{position:absolute;z-index:35;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 78px);padding:12px 14px;border-radius:15px;background:rgba(20,20,20,.88);color:#fff;font-size:11px;line-height:1.55;transform:translateY(150%);transition:.3s}
#status.show{transform:translateY(0)}
#state{font-weight:700}
#hit{position:absolute;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);display:none;padding:18px 22px;border-radius:18px;background:rgba(20,20,20,.92);color:#fff;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#hit b{font-size:18px}
#hit div{font-size:11px;margin-top:6px;opacity:.75}
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <img id="photo" src="map.png" alt="">
    <div id="veil"></div>

    <div id="startMark"></div>
    <div id="startLabel">출발 · 망월리 1253</div>

    <div class="zone" id="z1"><div><span>① 음악 1</span><small>망월길202번길 18</small></div></div>
    <div class="zone" id="z2"><div><span>② 음악 2</span><small>망월길202번길 21-3</small></div></div>
    <div class="zone" id="z3"><div><span>③ 음악 3</span><small>망월길202번길 11-7</small></div></div>
    <div class="zone" id="z4"><div><span>④ 음악 4</span><small>망월길202번길 8-3</small></div></div>
  </div>

  <div id="title"><b>GPS SOUND WALK TEST</b><div>망월리 · 구역 테스트</div></div>

  <div id="legend">
    <b>걸어볼 순서</b><br>
    출발  →  ① 음악 1  →  ② 음악 2  →  ③ 음악 3  →  ④ 음악 4<br>
    <span style="opacity:.68">각 구역은 약 14m 반경입니다. 같은 휴대폰 GPS로 구역 진입과 음악 전환을 테스트합니다.</span>
  </div>

  <div id="status">
    <div id="state">GPS 대기 중</div>
    <div id="coords">아래 버튼을 눌러 위치 사용을 시작하세요.</div>
  </div>

  <button id="start">GPS 테스트 시작 →</button>
  <div id="hit"><b id="hitTitle"></b><div id="hitSub"></div></div>
</div>

<script>
const zones = [
  {id:1,name:'음악 1',lat:37.748536510224,lon:126.3641535177,radius:14,notes:[392,494,587,494]},
  {id:2,name:'음악 2',lat:37.748321919452,lon:126.36386856924,radius:14,notes:[330,415,523,415]},
  {id:3,name:'음악 3',lat:37.748265357219,lon:126.36509585962,radius:14,notes:[294,370,440,370]},
  {id:4,name:'음악 4',lat:37.749200782221,lon:126.36465164542,radius:14,notes:[440,554,659,554]}
];

const startPoint={lat:37.748881513354,lon:126.36420024262};
let watchId=null, audioCtx=null, activeZone=null, entered={};
let audioTimer=null;

const status=document.getElementById('status');
const state=document.getElementById('state');
const coords=document.getElementById('coords');
const hit=document.getElementById('hit');
const hitTitle=document.getElementById('hitTitle');
const hitSub=document.getElementById('hitSub');

function setStatus(a,b){
  state.textContent=a;
  coords.textContent=b;
  status.classList.add('show');
}
function metersBetween(a,b,c,d){
  const R=6371000, p=Math.PI/180;
  const dLat=(c-a)*p, dLon=(d-b)*p;
  const x=Math.sin(dLat/2)**2 + Math.cos(a*p)*Math.cos(c*p)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function unlockAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  const buffer=audioCtx.createBuffer(1,1,audioCtx.sampleRate);
  const src=audioCtx.createBufferSource();
  src.buffer=buffer; src.connect(audioCtx.destination); src.start();
}
function stopMusic(){
  if(audioTimer){clearTimeout(audioTimer);audioTimer=null}
}
function playZoneMusic(zone){
  stopMusic();
  if(!audioCtx) unlockAudio();
  const notes=zone.notes;
  let i=0;
  function phrase(){
    if(activeZone!==zone.id)return;
    const now=audioCtx.currentTime;
    notes.forEach((f,k)=>{
      const osc=audioCtx.createOscillator();
      const gain=audioCtx.createGain();
      osc.type='sine';
      osc.frequency.value=f;
      gain.gain.setValueAtTime(0.0001,now+k*0.34);
      gain.gain.exponentialRampToValueAtTime(0.055,now+k*0.34+0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+k*0.34+0.30);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now+k*0.34);
      osc.stop(now+k*0.34+0.32);
    });
    audioTimer=setTimeout(phrase,1450);
  }
  phrase();
}
function showHit(zone){
  hitTitle.textContent=`${zone.id}번 구역 · ${zone.name}`;
  hitSub.textContent='구역 안으로 들어왔습니다. 음악이 바뀌었습니다.';
  hit.style.display='block';
  setTimeout(()=>hit.style.display='none',1800);
}
function handlePosition(pos){
  const lat=pos.coords.latitude,lon=pos.coords.longitude;
  const acc=Math.round(pos.coords.accuracy);
  const dStart=Math.round(metersBetween(lat,lon,startPoint.lat,startPoint.lon));

  let found=null,best=Infinity;
  for(const z of zones){
    const d=metersBetween(lat,lon,z.lat,z.lon);
    if(d<=z.radius && d<best){found=z;best=d}
  }

  if(found){
    if(activeZone!==found.id){
      activeZone=found.id;
      entered[found.id]=(entered[found.id]||0)+1;
      playZoneMusic(found);
      showHit(found);
    }
    setStatus(`${found.id}번 구역 · ${found.name}`,`현재 GPS 정확도 약 ${acc}m · 구역 중심까지 약 ${Math.round(best)}m · 출발점까지 약 ${dStart}m`);
  }else{
    if(activeZone!==null){
      activeZone=null;
      stopMusic();
    }
    let nearest=zones.map(z=>({z,d:metersBetween(lat,lon,z.lat,z.lon)})).sort((a,b)=>a.d-b.d)[0];
    setStatus('GPS 연결됨',`위도 ${lat.toFixed(6)} · 경도 ${lon.toFixed(6)} · 정확도 약 ${acc}m · 가장 가까운 구역 ${nearest.z.id}번까지 약 ${Math.round(nearest.d)}m`);
  }
}
function startGPS(){
  unlockAudio();
  document.getElementById('start').style.display='none';
  if(!navigator.geolocation){
    setStatus('GPS를 사용할 수 없습니다.','이 브라우저는 위치 정보를 지원하지 않습니다.');
    return;
  }
  setStatus('GPS 권한 요청 중…','위치 권한을 허용해 주세요.');
  watchId=navigator.geolocation.watchPosition(handlePosition,err=>{
    const m={1:'위치 권한이 거부되었습니다.',2:'현재 위치를 확인할 수 없습니다.',3:'GPS 요청 시간이 초과되었습니다.'};
    setStatus('GPS 오류',m[err.code]||'알 수 없는 GPS 오류입니다.');
  },{
    enableHighAccuracy:true,
    maximumAge:2000,
    timeout:15000
  });
}
document.getElementById('start').onclick=startGPS;
</script>
</body>
</html>
