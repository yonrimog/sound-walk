<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>행궁 Sound Walk · GPS 20m Test</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#111;color:#fff}
  #map{height:100%;width:100%}
  #panel{
    position:fixed;z-index:1000;left:12px;right:12px;top:12px;
    background:rgba(20,20,20,.88);backdrop-filter:blur(10px);
    border-radius:14px;padding:13px 15px;box-shadow:0 4px 24px rgba(0,0,0,.3);
    font-size:13px;line-height:1.5
  }
  #title{font-size:16px;font-weight:700;margin-bottom:5px}
  #status{color:#ddd}
  #gps{color:#aaa;margin-top:3px}
  #current{color:#9fe3b0;margin-top:3px}
  #buttons{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  button{
    border:0;border-radius:9px;padding:8px 11px;background:#fff;color:#111;
    font-weight:600;font-size:12px;cursor:pointer
  }
  button.secondary{background:#333;color:#fff}
  .leaflet-popup-content{font-size:13px}
  .zone-label{
    background:rgba(0,0,0,.78);color:#fff;border:0;border-radius:5px;
    padding:2px 5px;font-weight:700;box-shadow:none
  }
  .active-zone{font-weight:800}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="title">행궁 Sound Walk · GPS 30m 테스트</div>
  <div id="status">GPS 시작 버튼을 눌러 주세요.</div>
  <div id="gps"></div>
  <div id="current"></div>
  <div id="buttons">
    <button id="start">GPS 시작</button>
    <button id="stop" class="secondary">GPS 중지</button>
    <button id="reset" class="secondary">새로 시작</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const RADIUS = 30; // ★ 모든 지점 반경 20m

const places = [
  {id:1, name:"수원문화재단", lat:37.28115072746601, lng:127.01518049665039, audio:"../audio/1.mp3"},
  {id:2, name:"정조테마공연장", lat:37.28116408763919, lng:127.01634757949711, audio:"../audio/2.mp3"},
  {id:3, name:"수원종로교회", lat:37.28202453390769, lng:127.01668041542524, audio:"../audio/3.mp3"},
  {id:4, name:"매향통닭", lat:37.28173151865643, lng:127.0178953636229, audio:"../audio/4.mp3"},
  {id:5, name:"남수문", lat:37.278742230409456, lng:127.01847535835135, audio:"../audio/5.mp3"},
  {id:6, name:"팔달문", lat:37.27755979183475, lng:127.01730804484421, audio:"../audio/6.mp3"},
  {id:7, name:"행궁로가는길", lat:37.27826496211104, lng:127.01656400981683, audio:"../audio/7.mp3"},
  {id:8, name:"남창초등학교앞", lat:37.27849712862135, lng:127.01546467613876, audio:"../audio/8.mp3"},
  {id:9, name:"행궁광장", lat:37.28186699066884, lng:127.01566551890309, audio:"../audio/9.mp3"}
];

const map = L.map("map").setView([37.2802,127.0167],16);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:20, attribution:"© OpenStreetMap contributors"
}).addTo(map);

const zoneLayers = [];
places.forEach(p=>{
  const circle = L.circle([p.lat,p.lng],{
    radius:RADIUS, color:"#d33", weight:2, fillOpacity:.12
  }).addTo(map);
  circle.bindPopup(`<b>${p.id}. ${p.name}</b><br>반경 ${RADIUS}m`);
  circle.bindTooltip(`${p.id}. ${p.name}`,{
    permanent:true,direction:"top",className:"zone-label",offset:[0,-3]
  });
  zoneLayers.push(circle);
});

const allBounds = L.latLngBounds(places.map(p=>[p.lat,p.lng]));
map.fitBounds(allBounds.pad(.12));

let watchId = null;
let activeAudio = null;
let insideZones = new Set();

/*
  이번 페이지를 연 뒤 "처음 만난 zone"을 기록합니다.
  - 첫 zone이 1번이면 1번은 재생
  - 첫 zone이 2~9번이면 그 번호를 재생하고, 이후 1번은 무시
  - 2~9번은 이후 순서와 관계없이 각 zone에 들어갈 때 재생
  - 페이지를 새로 열면 이 상태가 다시 초기화됩니다.
*/
let sessionFirstZone = null;
let introDecisionMade = false;

const statusEl = document.getElementById("status");
const gpsEl = document.getElementById("gps");
const currentEl = document.getElementById("current");

function setStatus(t){ statusEl.textContent=t; }

function stopAudio(){
  if(activeAudio){
    activeAudio.pause();
    activeAudio.currentTime=0;
    activeAudio=null;
  }
}

function fadeTo(zone){
  const next=new Audio(zone.audio);
  next.loop=false;
  next.volume=0;

  next.play().then(()=>{
    if(activeAudio){
      const old=activeAudio;
      let v=old.volume;
      const out=setInterval(()=>{
        v-=.08;
        if(v<=0){
          clearInterval(out);
          old.pause();
          old.currentTime=0;
        }else{
          old.volume=v;
        }
      },80);
    }

    activeAudio=next;
    let v=0;
    const inc=setInterval(()=>{
      v+=.08;
      if(v>=1){
        v=1;
        clearInterval(inc);
      }
      next.volume=v;
    },80);
  }).catch(()=>{
    setStatus(`${zone.id}. ${zone.name} 도착 — 화면을 한 번 터치한 뒤 다시 시도해 주세요.`);
  });
}

function playZone(zone){
  /*
    첫 zone 결정:
    - 첫 진입이 1번이면 1번 재생
    - 첫 진입이 2~9번이면 해당 번호 재생
      → 이후 1번은 이번 페이지가 열려 있는 동안 무시
  */
  if(sessionFirstZone === null){
    sessionFirstZone = zone.id;
    introDecisionMade = true;
  }

  // 1번은 "이번 페이지를 연 뒤 첫 zone이 1번일 때만" 재생.
  if(zone.id === 1 && sessionFirstZone !== 1){
    return;
  }

  zoneLayers.forEach((c,i)=>{
    const active=(i+1===zone.id);
    c.setStyle({
      color:active?"#1aa260":"#d33",
      weight:active?4:2,
      fillOpacity:active?.22:.12
    });
  });

  if(zone.id === 1){
    currentEl.textContent="1번 인트로 · 이번 페이지에서 최초 1회";
  }else{
    currentEl.textContent=`${zone.id}번 음원 재생 · 순서와 관계없이 작동`;
  }

  setStatus(`${zone.id}. ${zone.name} 진입 · 반경 ${RADIUS}m`);
  fadeTo(zone);
}

function checkPosition(lat,lng,accuracy){
  const ds=places.map(p=>({
    p,
    d:distanceM(lat,lng,p.lat,p.lng)
  }));

  const nearest=ds.reduce((a,b)=>a.d<b.d?a:b);

  gpsEl.textContent=
    `GPS 정확도 ±${Math.round(accuracy)}m · 가장 가까운 지점 ${nearest.p.id}번까지 ${Math.round(nearest.d)}m`;

  const nowInside=new Set();

  /*
    정상적인 GPS 이동에서는 여러 zone이 동시에 겹칠 수 있습니다.
    처음 페이지를 연 직후 여러 zone 안에 있다면 가장 가까운 zone을
    먼저 선택하도록 하여 1번/다른 zone의 판단이 흔들리지 않게 합니다.
  */
  const inside=ds
    .filter(({d})=>d<=RADIUS)
    .sort((a,b)=>a.d-b.d);

  if(sessionFirstZone === null && inside.length){
    playZone(inside[0].p);
    nowInside.add(inside[0].p.id);

    // 첫 위치에서 동시에 들어온 다른 2~9번 zone도
    // 이후 GPS 업데이트에서 다시 진입할 수 있도록 상태를 잡습니다.
    inside.slice(1).forEach(({p})=>nowInside.add(p.id));
  }else{
    inside.forEach(({p})=>{
      nowInside.add(p.id);

      if(!insideZones.has(p.id)){
        playZone(p);
      }
    });
  }

  insideZones=nowInside;
}

function resetSequence(){
  stopAudio();
  insideZones.clear();
  sessionFirstZone=null;
  introDecisionMade=false;

  zoneLayers.forEach(c=>c.setStyle({
    color:"#d33",
    weight:2,
    fillOpacity:.12
  }));

  currentEl.textContent="이번 페이지에서 처음 만나는 지점에 따라 시작합니다.";
  setStatus("재생 상태를 초기화했습니다. 1번도 다시 재생할 수 있습니다.");
}

function startGPS(){
  if(!navigator.geolocation){
    setStatus("이 기기에서 GPS를 사용할 수 없습니다.");
    return;
  }
  if(watchId!==null) return;
  setStatus("GPS 위치를 확인하는 중…");
  watchId=navigator.geolocation.watchPosition(
    pos=>{
      const {latitude,longitude,accuracy}=pos.coords;
      if(window.userMarker) window.userMarker.setLatLng([latitude,longitude]);
      else{
        window.userMarker=L.circleMarker([latitude,longitude],{
          radius:7,color:"#1677ff",fillColor:"#1677ff",fillOpacity:.95,weight:3
        }).addTo(map).bindPopup("현재 위치");
      }
      checkPosition(latitude,longitude,accuracy);
    },
    err=>{
      setStatus(`GPS 오류: ${err.message}`);
    },
    {enableHighAccuracy:true,maximumAge:2000,timeout:15000}
  );
}

function stopGPS(){
  if(watchId!==null){
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
    setStatus("GPS를 중지했습니다.");
  }
}

function resetSequence(){
  stopAudio();
  currentZone=0; pendingZone=null;
  if(pendingTimer){clearTimeout(pendingTimer);pendingTimer=null;}
  zoneLayers.forEach(c=>c.setStyle({color:"#d33",weight:2,fillOpacity:.12}));
  currentEl.textContent="현재 재생 순서: 0/9";
  setStatus("순서를 초기화했습니다. 1번 지점부터 시작합니다.");
}

document.getElementById("start").onclick=startGPS;
document.getElementById("stop").onclick=stopGPS;
document.getElementById("reset").onclick=resetSequence;

// 모바일 브라우저의 오디오 정책을 위해 화면 터치 시 준비
document.addEventListener("click",()=>{}, {once:true});
</script>
</body>
</html>
